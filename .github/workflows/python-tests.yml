# Run the Python test suite on pull requests to main.
name: Python Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.4.1 pytest-cov

      - name: Run tests with detailed output
        run: |
          PYTHONPATH=. pytest -vv --cov=. --cov-report=term-missing --cov-report=xml
